name = "abadaoc-contact"
main = "contact-worker.js"
compatibility_date = "2026-08-11"

# All values below are secrets and must NOT be committed here.
# Set them once from this directory:
#
#   npx wrangler secret put TURNSTILE_SECRET
#   npx wrangler secret put APPS_SCRIPT_URL          # contact + booking
#   npx wrangler secret put WAIVER_SCRIPT_URL        # waiver form
#   npx wrangler secret put QUESTIONNAIRE_SCRIPT_URL # questionnaire form
#
# The *_SCRIPT_URL values are secrets because that is the whole point of this
# Worker: the Apps Script endpoints must stop being publicly readable. If one
# ends up in the site bundle or in git again, the spam route reopens. When you
# add WAIVER_SCRIPT_URL / QUESTIONNAIRE_SCRIPT_URL, create a NEW Apps Script
# deployment for each (a new /exec URL) so the old, already-public URL dies.
#
# Deploy with:
#
#   npx wrangler deploy
